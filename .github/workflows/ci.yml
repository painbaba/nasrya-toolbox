name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build & check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Advisory only for now — compilation is the hard gate below.
      - name: Format check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets

      - name: Build (release)
        run: cargo build --release

      - name: Smoke test (--version / list)
        run: |
          ./target/release/winsploit.exe --version
          ./target/release/winsploit.exe list

      # Advisory: catches .iss errors before a release tag does. Inno Setup 6 is
      # preinstalled on windows-latest.
      - name: Build installer (advisory)
        continue-on-error: true
        shell: pwsh
        run: |
          ./target/release/winsploit.exe --catalog tools.yaml packs --iss | Set-Content -Encoding ascii installer/packs.iss
          $iscc = (Get-Command ISCC -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=0.0.0-ci" installer/winsploit.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
