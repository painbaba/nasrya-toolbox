name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build & publish (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { '${{ github.event.inputs.tag }}' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $stage = "dist/winsploit"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/winsploit.exe $stage/
          Copy-Item tools.yaml $stage/
          Copy-Item README.md  $stage/
          Copy-Item LICENSE    $stage/
          $zip = "dist/winsploit-$tag-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Inno Setup 6 is preinstalled on windows-latest. The pack list is generated
      # from tools.yaml so the installer's checkboxes can't drift from the catalog.
      - name: Build installer (setup.exe)
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $ver = $tag.TrimStart('v')
          ./target/release/winsploit.exe --catalog tools.yaml packs --iss | Set-Content -Encoding ascii installer/packs.iss
          $iscc = (Get-Command ISCC -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$ver" installer/winsploit.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $setup = "dist/winsploit-$ver-setup.exe"
          if (-not (Test-Path $setup)) { throw "missing $setup" }
          "SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checksums
        shell: pwsh
        run: |
          $files = @($env:SETUP, $env:ZIP)
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$h  $(Split-Path -Leaf $f)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS
          Get-Content dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: winsploit ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ env.SETUP }}
            ${{ env.ZIP }}
            dist/SHA256SUMS
          body: |
            Prebuilt Windows x64 binary of **Winsploit** — native-Windows security toolbox & command runner.

            **Install (recommended):** run `winsploit-<version>-setup.exe`. It needs no admin rights,
            adds Winsploit to your PATH, can set up Scoop, git and pipx for you, and lets you pick tool
            packs. Verify downloads against `SHA256SUMS`.

            **Portable:** unzip anywhere, then run `winsploit.exe` (keep `tools.yaml` next to it).
            To use it as a `winsploit` command, add the unzipped folder to your PATH.

            > Authorized use only. The binary and installer are unsigned: SmartScreen may show
            > "More info" > "Run anyway", and with Smart App Control enabled you may need to allow it.
