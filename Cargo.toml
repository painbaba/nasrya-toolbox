[package]
name = "kali-tools-for-win"
version = "0.1.0"
edition = "2021"
description = "Native-Windows security toolbox: a TUI launcher that detects, installs (via Scoop) and runs pentest tools."
license = "MIT"

[[bin]]
name = "nasrya"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
